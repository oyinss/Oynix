<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- LCD subpixel rendering off (kept from the original file) -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

  <!-- MesloLGS name aliases.
       "MesloLGS NF" is the first entry in Hermes Desktop's terminal-font
       suggestion list and the name used by Powerlevel10k / romkatv's release,
       but the Arch nerd-fonts package ships the family as
       "MesloLGS Nerd Font". Without this alias the request matches nothing and
       silently falls back to Noto Sans (proportional, no Nerd glyphs). -->
  <match target="pattern">
    <test name="family">
      <string>MesloLGS NF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>MesloLGS Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>MesloLGS NFM</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>MesloLGS Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
