#####################################################
# Set default terminal
#####################################################
# set -g default-terminal "xterm-kitty"
# set-option -ga terminal-overrides ",xterm-kitty:Tc"

# set -g default-terminal "tmux-256color"
# set -g terminal-overrides ",xterm-256color:Tc"

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

####################################################
# Set prefix
####################################################
unbind C-b
set -g prefix C-Space
# Second prefix. `Ctrl+Space` never reaches tmux from some terminals (Ghostty/GTK can swallow
# the space key with ctrl held), which makes the whole prefix table unreachable. prefix2
# feeds the SAME key table, so every binding in this file works with Ctrl+A too, and
# Ctrl+Space keeps working wherever the terminal delivers it.
set -g prefix2 C-a
bind C-Space send-prefix

#####################################################
# Reload config
#####################################################
unbind r
bind r source-file ~/.config/tmux/tmux.conf

#####################################################
# Vim style pane selection
#####################################################
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#####################################################
# set options
#####################################################
set -g mouse on
set -g default-shell /bin/zsh
set -g repeat-time 1000
set-option -g status-position top

#####################################################
# Middle click pastes the system clipboard
#####################################################
# Stock tmux binds MouseDown2Pane to `paste-buffer`, which pastes tmux's own
# paste buffer rather than the system clipboard. tmux cannot read the system
# clipboard, so delegate to a helper that loads it via wl-paste.
bind -T root MouseDown2Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { run-shell "$HOME/.local/bin/tmux-paste-clipboard.sh" }

# Popups (floax scratchpad, sessionx, menus) get real rounded corners.
# NOTE: stock tmux has no rounded pane borders -- pane-border-lines only
# accepts single/double/heavy/simple/number/spaces.
set -g popup-border-lines rounded
set -g popup-border-style fg=#7f849c
set -g pane-border-style fg=#7f849c
set -g pane-active-border-style fg=#7aa2f7

#####################################################
# Shift arrow to switch windows
#####################################################
bind -n S-Left  previous-window
bind -n S-Right next-window

#####################################################
# Shift Alt vim keys to switch windows
#####################################################
bind -n M-H previous-window
bind -n M-L next-window

#####################################################
# Session switching
#####################################################
# Existing, prefix-based: C-Space O (sessionx fuzzy picker), C-Space s
# (choose-tree), C-Space ( / ) (previous / next), C-Space L (last used).
# Add a prefix-free key to match the no-prefix C-hjkl pane navigation.
bind -n M-s run-shell "$HOME/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

# Ctrl+S is also free in the root table (tmux only binds it in copy-mode for
# search, and zsh leaves ^S as self-insert), so use it for the same picker.
bind -n C-s run-shell "$HOME/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

#####################################################
# TokyoNight colors for Tmux
#####################################################
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_hostname 1
set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_show_git 0


#####################################################
# List of plugins
#####################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other plugins:
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence: resurrect saves sessions/windows/panes (and their cwd),
# continuum autosaves on an interval and restores on tmux server start.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

#####################################################
# Ctrl+L clears the screen instead of navigating panes
#####################################################
# vim-tmux-navigator binds C-l in the root table for pane navigation, so inside
# tmux Ctrl+L never reaches the shell and the screen never clears. Move the
# plugin's right-navigation to alt+ctrl+l so plain C-l falls through to the
# shell's clear-screen, matching the behaviour outside tmux.
set -g @vim_navigator_mapping_right 'C-M-l'

# Reloading the config does not remove bindings a plugin installed earlier, so
# drop any stale root-table C-l binding explicitly. Safe to run when unbound.
unbind -n C-l

#####################################################
# Copy mode bindings for vi
#####################################################
# set vi-mode
set-window-option -g mode-keys vi
set -g @yank_action 'copy-pipe'
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#####################################################
# split pane bindings
#####################################################
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Splits without the prefix -- one keystroke each (hold Alt; no prefix, no release dance).
# Side by side is bound to BOTH Alt+= and Alt++ so it fires whichever form the terminal sends
# for that key (the shifted form encodes differently under extended-keys). Minus draws the
# horizontal divider. The backslash variant was dropped: that key does not report on their
# keyboard, and an unreachable binding is just noise.
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-+ split-window -h -c "#{pane_current_path}"
# The same key with shift held arrives as a distinct encoding under extended-keys (kitty sends
# CSI 61;4u / 43;4u), so bind the shifted names as well -- otherwise Alt+Shift+= silently does
# nothing while Alt+= works. Verified by driving both encodings through a live client.
bind -n M-S-= split-window -h -c "#{pane_current_path}"
bind -n M-S-+ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#####################################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#####################################################
run '~/.config/tmux/plugins/tpm/tpm'

#####################################################
# Segmented Tokyo Night status bar
#####################################################
# This block intentionally sits *after* the tpm run line so the hand-written bar
# wins over tokyo-night-tmux's default status-left/right. Side effect: continuum
# can only prepend its autosave hook to status-right at plugin-load time, and
# this overwrite throws that away -- so the hook is added by hand below.
# continuum_save.sh returns immediately unless the save interval has elapsed.
set -g status-style "bg=#1A1B26"
set -g status-left-length 80
set -g status-right-length 150
set -g status-left "#{?client_prefix,#[fg=#ff9e64,bg=#1A1B26]#[fg=#1A1B26,bg=#ff9e64,bold] PREFIX #[fg=#ff9e64,bg=#1A1B26],}#[fg=#9ece6a,bg=#1A1B26]#[fg=#1A1B26,bg=#9ece6a,bold]  #[fg=#c0caf5,bg=#2A2F41,bold] #S #[fg=#2A2F41,bg=#1A1B26] "
set -g window-status-current-format "#[fg=#2A2F41,bg=#1A1B26]#[fg=#c0caf5,bg=#2A2F41,bold] #W #[fg=#1A1B26,bg=#ff9e64,bold] #I #[fg=#ff9e64,bg=#1A1B26] "
set -g window-status-format "#[fg=#7f849c,bg=#1A1B26] #W #[fg=#7f849c]#I "
set -g window-status-separator ""
set -g status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#($HOME/.local/bin/tmux-git-status.sh #{q:pane_current_path}) #[fg=#7aa2f7,bg=#1A1B26]#[fg=#1A1B26,bg=#7aa2f7,bold] 󰥔 #[fg=#c0caf5,bg=#2A2F41,bold] #(date '+%H:%M') #[fg=#2A2F41,bg=#1A1B26]"
# Third status line (row 2 is the blank spacer): the active pane's directory, left-aligned
# and home-shortened by tmux-path.sh. The git chip lives on row 1 instead, just before
# the clock (see status-right).
set -g status 3
# Blank row between the two informational lines -- tmux has no half-line padding,
# so a spacer status line is the only way to get vertical breathing room.
set -g status-format[1] " "

# How often tmux re-runs the `#()` jobs in the status line (clock, git chip, path).
# 15s (the default) made the directory look stale right after a cd; chpwd also asks for
# an immediate refresh (see the hook in config/zsh/core.zsh), so this interval only
# covers changes made without a cd -- git counts ticking up as files are edited.
set -g status-interval 5
set -g status-format[2] "#[align=left]#[fg=#bb9af7,bg=#1A1B26]#[fg=#1A1B26,bg=#bb9af7,bold] 󰉋 #[fg=#c0caf5,bg=#2A2F41,bold] #($HOME/.local/bin/tmux-path.sh #{q:pane_current_path}) #[fg=#2A2F41,bg=#1A1B26]"
