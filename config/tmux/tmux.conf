#####################################################
# Set default terminal
#####################################################
# set -g default-terminal "xterm-kitty"
# set-option -ga terminal-overrides ",xterm-kitty:Tc"

# set -g default-terminal "tmux-256color"
# set -g terminal-overrides ",xterm-256color:Tc"

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

####################################################
# Set prefix
####################################################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#####################################################
# Reload config
#####################################################
unbind r
bind r source-file ~/.config/tmux/tmux.conf

#####################################################
# Vim style pane selection
#####################################################
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

#####################################################
# set options
#####################################################
set -g mouse on
set -g default-shell /bin/zsh
set -g repeat-time 1000
set-option -g status-position top
# Popups (floax scratchpad, sessionx, menus) get real rounded corners.
# NOTE: stock tmux has no rounded pane borders -- pane-border-lines only
# accepts single/double/heavy/simple/number/spaces.
set -g popup-border-lines rounded
set -g popup-border-style fg=#7f849c
set -g pane-border-style fg=#7f849c
set -g pane-active-border-style fg=#7aa2f7

#####################################################
# Shift arrow to switch windows
#####################################################
bind -n S-Left  previous-window
bind -n S-Right next-window

#####################################################
# Shift Alt vim keys to switch windows
#####################################################
bind -n M-H previous-window
bind -n M-L next-window

#####################################################
# TokyoNight colors for Tmux
#####################################################
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_hostname 1
set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_show_git 0


#####################################################
# List of plugins
#####################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other plugins:
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @plugin 'tmux-plugins/tmux-yank'         

#####################################################
# Copy mode bindings for vi
#####################################################
# set vi-mode
set-window-option -g mode-keys vi
set -g @yank_action 'copy-pipe'
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#####################################################
# split pane bindings
#####################################################
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#####################################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#####################################################
run '~/.config/tmux/plugins/tpm/tpm'

#####################################################
# Segmented Tokyo Night status bar
#####################################################
set -g status-style "bg=#1A1B26"
set -g status-left-length 80
set -g status-right-length 150
set -g status-left "#[fg=#1A1B26,bg=#9ece6a,bold]  #[fg=#c0caf5,bg=#2A2F41]#S "
set -g window-status-current-format "#[fg=#c0caf5,bg=#2A2F41] #W #[fg=#1A1B26,bg=#ff9e64,bold] #I "
set -g window-status-format "#[fg=#7f849c,bg=#1A1B26] #W #[fg=#7f849c]#I "
set -g window-status-separator ""
set -g status-right "#[fg=#1A1B26,bg=#bb9af7,bold] 󰉋 #[fg=#c0caf5,bg=#2A2F41] #{b:pane_current_path} #[fg=#1A1B26,bg=#7aa2f7,bold] 󰃰 #[fg=#c0caf5,bg=#2A2F41] 󰣇 #[fg=#1A1B26,bg=#7aa2f7,bold] 󰥔 #[fg=#c0caf5,bg=#2A2F41] #(date '+%H:%M') "
